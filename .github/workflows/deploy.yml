name: Déploiement GitHub Pages

on:
  push:
    branches: [main, claude/intelligent-volta-0fy61q]
  workflow_dispatch: {}

# Permissions nécessaires pour publier sur Pages.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build du client
        env:
          # Sert le site sous /<repo>/ sur GitHub Pages.
          BASE_PATH: /${{ github.event.repository.name }}/
          # URL du serveur WebSocket en ligne (à définir dans les variables du dépôt
          # une fois le serveur déployé, ex: wss://web-royale.onrender.com).
          VITE_WS_URL: ${{ vars.VITE_WS_URL }}
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
