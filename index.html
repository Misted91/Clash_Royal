<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Web Royale</title>
    <style>
      :root {
        --bg: #0e1116;
        --panel: #161b22;
        --accent: #d946ef;
        --text: #e6edf3;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        overflow: hidden;
      }
      #app {
        display: flex;
        flex-direction: column;
        align-items: center;
        height: 100%;
      }
      #stage-wrap {
        position: relative;
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
      }
      canvas { display: block; touch-action: none; }

      #menu {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: rgba(14, 17, 22, 0.92);
        z-index: 10;
        text-align: center;
      }
      #menu h1 {
        margin: 0;
        font-size: 42px;
        letter-spacing: 2px;
        background: linear-gradient(90deg, #d946ef, #38bdf8);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      #menu p { max-width: 340px; color: #9aa4b2; margin: 0 0 8px; }
      .btn {
        background: var(--panel);
        color: var(--text);
        border: 1px solid #2d333b;
        border-radius: 10px;
        padding: 14px 28px;
        font-size: 18px;
        cursor: pointer;
        min-width: 240px;
        transition: transform 0.08s, border-color 0.15s;
      }
      .btn:hover { border-color: var(--accent); transform: translateY(-1px); }
      .btn:active { transform: translateY(1px); }
      #status { color: #9aa4b2; min-height: 22px; font-size: 14px; }
      .hidden { display: none !important; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="stage-wrap">
        <div id="menu">
          <h1>WEB ROYALE</h1>
          <p>Un prototype de jeu de stratégie temps réel 1v1 inspiré de Clash Royale.</p>
          <button class="btn" id="btn-solo">🤖 Jouer contre l'IA</button>
          <button class="btn" id="btn-online">🌐 Match en ligne (1v1)</button>
          <div id="status"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
